name: Smoke test after deploy

# Railway reports each deploy to GitHub as a deployment. When one succeeds, this checks the
# live demo the way a visitor reaches it: health, the page, a live SSE stream, and axe
# (spec §10). Set the repository variable SMOKE_URL to the public origin; without it, the
# deployment's own URL is used.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_URL: ${{ vars.SMOKE_URL || github.event.deployment_status.environment_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check there is something to test
        run: test -n "$SMOKE_URL" || { echo "Set the SMOKE_URL repository variable"; exit 1; }
      - run: pnpm test:smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
