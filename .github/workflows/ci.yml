name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, types, unit tests
    runs-on: ubuntu-latest
    # A hang (install, a stuck test) would otherwise hold the check for GitHub's default of six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @holdfast/web build
      - run: pnpm test:unit

  integration:
    name: Integration tests (Postgres via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers uses the runner's Docker, the same path as a local run.
      - run: pnpm test:integration

  e2e:
    name: End-to-end (Playwright, Stripe fake)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same two-instance server and built page as locally, against service containers.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: holdfast
          POSTGRES_PASSWORD: holdfast
          POSTGRES_DB: holdfast
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U holdfast -d holdfast"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://holdfast:holdfast@localhost:5432/holdfast
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # No Stripe keys here: the fake runs the bid war. The real-card project is by hand.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  load:
    name: Load (k6 storm and invariant checker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Spec §10: a short storm on every PR, through two instances, the round-robin proxy,
    # Redis and the shared Stripe fake with failures injected; then the checker.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: holdfast
          POSTGRES_PASSWORD: holdfast
          POSTGRES_DB: holdfast
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U holdfast -d holdfast"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://holdfast:holdfast@localhost:5432/holdfast
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Start the stack (shared fake, two instances, proxy)
        run: |
          nohup pnpm load:stack > stack.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf localhost:3000/api/healthz && curl -sf localhost:4010/healthz && exit 0
            sleep 1
          done
          cat stack.log; exit 1
      - run: pnpm load
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-results
          path: |
            load/results/
            stack.log
          retention-days: 7

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings show in the job log; commenting would need pull-requests: write.
          GITLEAKS_ENABLE_COMMENTS: 'false'
